name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly re-run against the current advisory database (osv.dev moves while
  # the repo is idle); a red scheduled run on main is the freshness signal.
  schedule:
    - cron: "0 21 * * 0"  # Mondays 06:00 JST

permissions:
  contents: read

jobs:
  # Second layer for the classification gate. The pre-commit hook is the first,
  # and it can be bypassed with --no-verify — so the same script runs here,
  # where it cannot be skipped by whoever authored the commit.
  classification-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the range check needs history back to the merge base
      - name: Run the classification gate
        env:
          # Via env rather than inline expansion: these are attacker-influenced
          # strings on a fork PR, and must never be interpolated into the shell.
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
            python scripts/classification-gate.py --range "$base" HEAD
          else
            python scripts/classification-gate.py --all
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --locked
      - run: uv sync --all-extras
      - run: uv run ruff check src/ tests/ app/
      - run: uv run ruff format --check src/ tests/ app/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: uv sync --all-extras
      - run: uv run pyright

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Direct release-asset download, pinned by version AND binary SHA-256 — no
      # installer script. The upstream install.sh is fetched from a moving `main`,
      # so any change there would execute here on the next run, including the
      # weekly scheduled one that nobody triggers. It also resolves versions via
      # an unauthenticated api.github.com call (rate-limited per shared runner IP
      # → random CI failures) and installs LATEST when called without a version.
      # Release assets come from GitHub's CDN (no API rate limit), and the
      # checksum covers the binary itself. Keep OPENGREP_VERSION in step with the
      # local install so CI == local. On bump, regenerate the checksum:
      #   curl -fsSL "https://github.com/opengrep/opengrep/releases/download/<tag>/opengrep_manylinux_x86" | sha256sum
      - name: Install opengrep
        env:
          OPENGREP_VERSION: v1.25.0
          OPENGREP_BIN_SHA256: 9ac4aebb47ba3f7b0d8fc641ac8749cb6c2f253f616131a67d9631e00d4bea33
        run: |
          install_dir="$HOME/.opengrep/bin"
          mkdir -p "$install_dir"
          curl -fsSL -o "$install_dir/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_BIN_SHA256}  $install_dir/opengrep" | sha256sum -c -
          chmod +x "$install_dir/opengrep"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/opengrep" --version
      - name: Run opengrep SAST
        run: opengrep scan --config auto --error src/ app/

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2  # v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --recursive
            .


  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv pip install en_core_web_sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - run: uv pip install ja_core_news_sm@https://github.com/explosion/spacy-models/releases/download/ja_core_news_sm-3.8.0/ja_core_news_sm-3.8.0-py3-none-any.whl
      - run: uv run pytest --cov=si_protocols --cov-report=term-missing

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # On a pull request the action computes the correct range
      # (`--no-merges --first-parent <base>^..<head>`) and reports findings as
      # PR comments, so it stays. It is NOT used on push — see below.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Without this the action resolves the LATEST gitleaks release at run
          # time, so a SHA-pinned action still downloads an unpinned binary and
          # the gate can change with no repo change. Keep in step with the
          # gitleaks `rev` in .pre-commit-config.yaml — two gates, one rule set,
          # and nothing but this comment forcing them to agree. No `v` prefix.
          GITLEAKS_VERSION: "8.30.0"

      # On push the action's range arithmetic cannot cover a merge commit, and
      # is not configurable: `--log-opts` is hard-coded (src/gitleaks.js:103-116)
      # and BASE_REF overrides only the base ref, leaving `--no-merges
      # --first-parent` in place. That pair walks a merge commit back into
      # main's previous tip and then drops the merge itself, so the branch
      # commits carrying the content are never visited — 0 commits scanned, and
      # a green tick.
      #
      # Scanning the whole history instead removes the range arithmetic rather
      # than trying to get it right, so coverage no longer depends on how a pull
      # request was merged. It costs ~0.6s over 149 commits / 2.04 MB.
      #
      # Checksum: gitleaks_8.30.0_checksums.txt from the release.
      - name: Install gitleaks (pinned)
        if: github.event_name != 'pull_request'
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          install_dir="$HOME/.gitleaks/bin"
          mkdir -p "$install_dir"
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$install_dir" gitleaks
          chmod +x "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan full history for secrets
        if: github.event_name != 'pull_request'
        run: gitleaks detect --redact -v --exit-code=1 --config=.gitleaks.toml
