[extend]
useDefault = true

# Custom rule for Anthropic API keys (sk-ant- pattern)
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[a-zA-Z0-9\-_]{20,}'''
keywords = ["sk-ant-"]
tags = ["api", "anthropic", "key"]

# Cloudflare API tokens (starts with letters, 40 chars)
[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API Token"
regex = '''[a-zA-Z0-9_]{37,40}'''
keywords = ["CF_API_TOKEN", "CLOUDFLARE_API_TOKEN"]
tags = ["api", "cloudflare"]

# Generic high-entropy secrets in Python files
[[rules]]
id = "python-secret-assignment"
description = "Hardcoded secret in Python"
regex = '''(?i)(api_key|secret|token|password)\s*=\s*["\'][a-zA-Z0-9\-_]{16,}["\']'''
path = '''\.py$'''
tags = ["python", "secret"]

# Allowlist for false positives.
#
# Markdown is deliberately NOT exempt. A blanket '''\.md$''' entry lived here
# until 2026-07-27, from when markdown meant a few prose files. The July 2026
# handover folded the whole documentation corpus into markdown under docs/, so
# the exemption had quietly made the repo's largest body of text invisible to
# secret scanning — in a public repo. Do not restore it: allowlist individual
# findings by path and rule instead, with a comment saying why each is benign.
[allowlist]
description = "Global allowlist"
paths = [
    '''^\.gitleaks\.toml$''',
    '''^tests/.*test.*\.py$''',
    '''__pycache__''',
    '''(.*?)(jpg|gif|doc|pdf|bin|svg|png|webp)$''',
]

# Allow example/placeholder patterns
regexes = [
    '''sk-ant-your-key-here''',
    '''sk-ant-\.\.\.''',
    '''your_.*_here''',
    '''REPLACE_WITH_.*''',
    '''<YOUR_.*>''',
]
